name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  attribution:
    uses: ZakJRademacher/portfolio-ci/.github/workflows/attribution.yml@e2365dabafc74c0cd450d1a9a4201f92ec17d518 # v1.0.0 + e2365da

  hygiene:
    uses: ZakJRademacher/portfolio-ci/.github/workflows/hygiene.yml@e2365dabafc74c0cd450d1a9a4201f92ec17d518 # v1.0.0 + e2365da
    permissions:
      contents: read
      pull-requests: read
    with:
      live-url: https://perigee.zakjrademacher.workers.dev/

  blocked-names:
    uses: ZakJRademacher/portfolio-ci/.github/workflows/blocked-names.yml@e2365dabafc74c0cd450d1a9a4201f92ec17d518 # v1.0.0 + e2365da
    secrets:
      blocked-names: ${{ secrets.PORTFOLIO_BLOCKED }}
      blocked-stems: ${{ secrets.PORTFOLIO_BLOCKED_STEMS }}
