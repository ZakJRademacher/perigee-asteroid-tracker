name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  attribution:
    uses: ZakJRademacher/portfolio-ci/.github/workflows/attribution.yml@e2365dabafc74c0cd450d1a9a4201f92ec17d518 # v1.0.0 + e2365da

  release:
    needs: attribution
    uses: ZakJRademacher/portfolio-ci/.github/workflows/release.yml@e2365dabafc74c0cd450d1a9a4201f92ec17d518 # v1.0.0 + e2365da
    permissions:
      contents: write
    secrets:
      blocked-names: ${{ secrets.PORTFOLIO_BLOCKED }}
      blocked-stems: ${{ secrets.PORTFOLIO_BLOCKED_STEMS }}
